<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎆 Happy New Year 2026</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle, #1a1a2e, #000);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 60px;
      font-size: 3rem;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    input {
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      margin-top: 20px;
      width: 240px;
    }

    button {
      padding: 12px 22px;
      margin-left: 10px;
      border: none;
      border-radius: 6px;
      background: #ffcc00;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ffb300;
    }

    .message {
      margin-top: 30px;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .confetti {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      top: 0;
      left: 0;
    }

    .piece {
      position: absolute;
      width: 8px;
      height: 8px;
      animation: fall 4s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="confetti" id="confetti"></div>

  <h1>🎉 Happy New Year 2026 🎉</h1>
  <p>Enter your name to receive a special wish</p>

  <input type="text" id="name" placeholder="Your name" />
  <button onclick="celebrate()">Celebrate 🎊</button>

  <div class="message" id="message"></div>

  <script>
    const confetti = document.getElementById("confetti");

    function createConfetti() {
      const piece = document.createElement("div");
      piece.classList.add("piece");
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
      piece.style.animationDuration = Math.random() * 3 + 2 + "s";
      confetti.appendChild(piece);

      setTimeout(() => piece.remove(), 5000);
    }

    setInterval(createConfetti, 120);

    function celebrate() {
      const name = document.getElementById("name").value;
      const message = document.getElementById("message");

      if (name.trim()) {
        message.innerHTML = `🎆 Happy New Year, <b>${name}</b>!<br>May 2026 bring success, peace & happiness 💫`;
      } else {
        message.innerHTML = `🎆 Happy New Year! May 2026 be amazing for you 💫`;
      }
    }
  </script>

</body>
</html>
